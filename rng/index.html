<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Infinite RNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #171717;
      color: #f2f2f2;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
    main { width: 100%; max-width: 340px; }
    h1 { margin: 0 0 8px; font-size: 25px; font-weight: 800; }
    p { margin: 0 0 22px; color: #aaa; font-size: 14px; font-weight: 700; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #ddd; font-weight: 700; }
    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #242424;
      color: #fff;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #888; }
    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 4px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #submit-button { margin-top: 20px; background: #eee; color: #171717; }
    #skip-button { margin-top: 9px; background: #303030; color: #eee; }
    #switch-mode {
      margin-top: 14px;
      padding: 5px;
      background: transparent;
      color: #aaa;
      font-size: 13px;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 18px; margin: 12px 0 0; color: #ff8888; font-size: 13px; }
    #leaderboard-link { display: block; margin-top: 18px; color: #aaa; font-size: 13px; text-align: center; text-decoration: none; }
    #leaderboard-link:hover { color: #fff; }
    [hidden] { display: none !important; }
  </style>
  <script type="module" src="script.js?v=7"></script>
</head>
<body>
  <main>
    <h1>Infinite RNG</h1>
    <p id="form-intro">Choose a username and password, or just skip.</p>

    <form id="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>

      <button id="submit-button" type="submit">Continue</button>
    </form>

    <button id="skip-button" type="button">Skip</button>
    <button id="switch-mode" type="button">Already have an account? Log in</button>
    <div id="message" role="alert" aria-live="polite"></div>

    <section id="leaderboard">
      <h2>Leaderboard</h2>
      <div id="leaderboard-list">Loading...</div>
    </section>
  </main>
</body>
</html>
