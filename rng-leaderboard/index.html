<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>RNG Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 42px 20px;
      background: #171717;
      color: #f2f2f2;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
    main { width: 100%; max-width: 520px; margin: 0 auto; }
    h1 { margin: 0 0 7px; font-size: 26px; font-weight: 800; }
    p { margin: 0 0 24px; color: #999; font-size: 13px; }
    .table-head, .leaderboard-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 90px;
      align-items: center;
      gap: 12px;
    }
    .table-head {
      padding: 0 12px 11px;
      color: #777;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .table-head span:last-child { text-align: right; }
    #leaderboard-list {
      max-height: min(68vh, 620px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }
    #leaderboard-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .leaderboard-row {
      min-height: 43px;
      padding: 0 12px;
      border-radius: 4px;
      color: #c8c8c8;
      font-size: 12px;
    }
    .leaderboard-row:nth-child(even) { background: #202020; }
    .rank { color: #777; }
    .username { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rolls { color: #f1f1f1; text-align: right; font-variant-numeric: tabular-nums; }
    #status { padding: 16px 12px; color: #999; font-size: 12px; }
    a { display: inline-block; margin-top: 22px; color: #aaa; font-size: 12px; text-decoration: none; }
    a:hover { color: #fff; }
  </style>
  <script type="module" src="script.js?v=2"></script>
</head>
<body>
  <main>
    <h1>Leaderboard</h1>
    <p>Top 100 players by total rolls</p>
    <div class="table-head"><span>Rank</span><span>Username</span><span>Rolls</span></div>
    <section id="leaderboard-list" aria-live="polite"><div id="status">Loading leaderboard...</div></section>
    <a href="/rng/">Back to RNG</a>
  </main>
</body>
</html>
