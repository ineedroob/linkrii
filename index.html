<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>LinkRii Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; text-shadow: none !important; box-shadow: none !important; filter: none !important; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background: #171717;
      color: #f4f4f4;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }
    .page { width: 100%; max-width: 560px; }
    .clicker {
      padding: 34px 24px 30px;
      text-align: center;
      background: #202020;
      border: 1px solid #303030;
      border-radius: 12px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #929292;
      font-size: 12px;
      font-weight: 700;
    }
    .score {
      margin: 0;
      color: #f4f4f4;
      font-size: clamp(42px, 10vw, 58px);
      line-height: 1.15;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .click-button {
      display: inline-grid;
      place-items: center;
      width: 112px;
      min-height: 112px;
      margin: 26px auto 18px;
      padding: 12px;
      border: 1px solid #393939;
      border-radius: 9px;
      background: #191919;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .click-button:active { transform: scale(.98); }
    .click-button:focus-visible, a:focus-visible, button:focus-visible {
      outline: 2px solid #00aaff;
      outline-offset: 4px;
    }
    .clicker-logo { display: block; width: 76px; height: 76px; object-fit: contain; }
    .hint { margin: 0; color: #888; font-size: 11px; font-weight: 600; }
    .rng-prompt {
      margin-top: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #202020;
      border: 1px solid #303030;
      border-radius: 12px;
    }
    .rng-copy { min-width: 0; }
    .rng-copy h2 { margin: 0 0 5px; font-size: 14px; font-weight: 800; }
    .rng-copy p { margin: 0; color: #999; font-size: 11px; line-height: 1.5; }
    .rng-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .rng-link {
      display: inline-block;
      padding: 10px 13px;
      border-radius: 6px;
      background: #00aaff;
      color: #101010;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .dismiss {
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: #888;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }
    .dismiss:hover { color: #ddd; }
    @media (max-width: 480px) {
      .rng-prompt { align-items: flex-start; flex-direction: column; }
      .rng-actions { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="clicker" aria-label="LinkRii clicker">
      <p class="eyebrow">Total clicks</p>
      <p id="score" class="score" aria-live="polite">0</p>
      <button class="click-button" id="logoBtn" type="button" aria-label="Click to increase your score">
        <img src="clickicon.png" alt="Click" class="clicker-logo">
      </button>
      <p class="hint">Click the icon to add a click</p>
    </section>

    <section class="rng-prompt" id="rngPrompt">
      <div class="rng-copy">
        <h2>Roob&#39;s RNG</h2>
        <p>Sol&#39;s RNG but in Infinite Homepage.</p>
      </div>
      <div class="rng-actions">
        <a class="rng-link" href="/rng/">Open RNG</a>
        <button class="dismiss" id="dismissPrompt" type="button">Not now</button>
      </div>
    </section>
  </main>

  <script>
    const scoreDisplay = document.getElementById('score');
    const logoButton = document.getElementById('logoBtn');
    const prompt = document.getElementById('rngPrompt');
    let count = 0;

    logoButton.addEventListener('click', () => {
      count += 1;
      scoreDisplay.textContent = count.toLocaleString();
    });

    document.getElementById('dismissPrompt').addEventListener('click', () => {
      prompt.hidden = true;
    });
  </script>
</body>
</html>
